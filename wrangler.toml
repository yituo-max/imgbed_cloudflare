name = "imgbed2"
compatibility_date = "2024-01-01"
main = "src/index.js"
compatibility_flags = ["nodejs_compat"]

# R2存储桶配置
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "imgbed-bucket"

# 环境变量（需要在Cloudflare Dashboard中设置）
[vars]
CF_ACCOUNT_ID = "d5d62e3db50b4c8a53117b0afe6a7cbb"
R2_ACCESS_KEY_ID = "你的R2访问密钥ID"
R2_SECRET_ACCESS_KEY = "你的R2秘密访问密钥"
R2_BUCKET_NAME = "imgbed-bucket"